# Protocol entry points. One row per (protocol, network); the row names a
# contract that can list the protocol's receipt tokens, never the tokens.
#
# Every address below was verified on chain on 2026-09-06 by making the call
# its kind implies and checking that it answered. Add nothing here that has not
# answered - a wrong address reports zero, which is indistinguishable from not
# holding the position. `pw catalog-check` repeats the verification.
#
# kind: aave_v3     -> address is a PoolAddressesProvider
# kind: compound_v2 -> address is a Comptroller

- protocol: aave-v3
  chain: ethereum
  kind: aave_v3
  address: "0x2f39d218133afab8f2b819b1066c7e434ad94e9e"
  note: 67 aTokens at the time of writing

